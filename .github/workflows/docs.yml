name: docs

on:
    push:
        branches: [develop, main]
        paths:
            - "docs/**"
            - "src/**"
            - "pnpm-lock.yaml"
            - ".github/workflows/docs.yml"
    workflow_dispatch:

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            # `--frozen-lockfile` é o default no CI, e é o que se quer: o postinstall
            # de cada subprojeto roda `nuxi prepare`, então este passo já popula os
            # `.nuxt` de que os seguintes dependem.
            - run: pnpm install

            # O `postinstall` já rodou `nuxi prepare` em cada subprojeto, mas naquele
            # momento o módulo ainda não tinha stub — daí stubar e preparar de novo,
            # para o `docs/.nuxt` nascer com os tipos de verdade do `#rform/*`.
            - run: pnpm exec nuxt-module-build build --stub && pnpm exec nuxt-module-build prepare

            - run: pnpm exec nuxi prepare docs

            # `build`, e não `generate`: o endpoint `/mcp` é rota POST de runtime, e
            # estático não a serve. Os dois JSON gerados (`api.json` e `mcp.json`) saem
            # dos módulos de `docs/modules/`, dentro deste build — não há passo à parte.
            - run: pnpm --filter rform-docs build

            - uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: docs
                  command: deploy