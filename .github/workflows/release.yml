name: release

# Dispara na tag que o `changelogen --release` cria. Publicar daqui é o que
# resolve o 2FA: um token de automação do npm não pede OTP, e OTP não existe
# em terminal não-interativo.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:

# Sem `cancel-in-progress`: cancelar um publish pela metade é pior que esperar.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            # O `registry-url` é o que escreve o `.npmrc` com o `_authToken` lendo
            # `NODE_AUTH_TOKEN` — o pnpm expande a variável na hora do publish.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: pnpm

            - run: pnpm install

            # Os `.nuxt` dos seis apps mais a fixture, que o `test:types` exige.
            - run: pnpm run dev:prepare

            - run: pnpm run lint

            - run: pnpm run test:types

            - run: pnpm exec playwright-core install --with-deps chromium

            - run: pnpm run test

            # `--no-git-checks` é obrigatório: numa tag o checkout é detached, e o
            # `publishBranch: develop` do pnpm-workspace.yaml reprovaria. O `prepack`
            # roda sozinho, pelo lifecycle do publish.
            - run: pnpm publish --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # O changelogen escreve o CHANGELOG.md e para aí ("Followup in the
            # browser"); esta etapa recorta a seção da versão e cria a release.
            - name: GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  awk -v tag="## $TAG" '$0 == tag { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
                  gh release create "$TAG" --title "$TAG" --notes-file notes.md
