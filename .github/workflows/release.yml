name: release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: write

            # É por aqui que o publish autentica, pelo trusted publishing do npm.
            id-token: write

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: pnpm

            - run: pnpm install

            # Os `.nuxt` que o `test:types` exige, a fixture inclusive.
            - run: pnpm run dev:prepare

            - run: pnpm run lint

            - run: pnpm run test:types

            - run: pnpm exec playwright-core install --with-deps chromium

            - run: pnpm run test

            # Numa tag o checkout é detached, e o `publishBranch` reprovaria.
            - run: pnpm publish --no-git-checks

            - name: GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  awk -v tag="## $TAG" '$0 == tag { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
                  gh release create "$TAG" --title "$TAG" --notes-file notes.md
