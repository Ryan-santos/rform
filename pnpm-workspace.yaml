packages:
    - docs
    - playgrounds/*

# Toda entrada é obrigatória mesmo dizendo `false`: sem uma decisão explícita o
# pnpm 11 sai com código 1 (`ERR_PNPM_IGNORED_BUILDS`) num clone novo.
#
# `esbuild: false` — o binário chega pronto pelo optional dep de plataforma.
# `better-sqlite3: true` — o `@nuxt/content` do docs precisa do binding nativo.
# `core-js-pure: false` — só o banner de financiamento; ele chega pelo `agents`,
# que o `@nuxtjs/mcp-toolkit` exige no preset da Cloudflare.
allowBuilds:
    esbuild: false
    better-sqlite3: true
    core-js-pure: false

# Este repo desenvolve em `develop`. Sem isto o `pnpm publish` barra com
# `ERR_PNPM_BRANCH_IS_NOT_PREPUBLISH`, porque o default é `main`/`master`.
publishBranch: develop
